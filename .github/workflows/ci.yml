name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint and build storefront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: artreelandstore
        run: npm ci

      - name: Lint
        working-directory: artreelandstore
        run: npm run lint

      - name: Build
        working-directory: artreelandstore
        run: npm run build