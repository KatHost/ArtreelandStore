name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "artreelandstore/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: artreelandstore/package-lock.json

      - name: Install dependencies
        working-directory: artreelandstore
        run: npm ci

      - name: Lint
        working-directory: artreelandstore
        run: npm run lint

      - name: Build
        working-directory: artreelandstore
        env:
          PAGES_BUILD: "true"
          VITE_PAYMENTS_ENABLED: "false"
        run: |
          npm run build
          cp dist/index.html dist/404.html
          rm -rf dist/api
          rm -f dist/data/catalog-seed.sql

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artreelandstore/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
